plugins {
    id 'java'
    id 'net.serenity-bdd.serenity-gradle-plugin' version '4.0.30'
    id 'org.sonarqube' version '4.4.1.3373'
}

group = 'co.com.sqa.certificacion'
version = '1.0.0'

repositories {
    mavenCentral()
}

ext {
    serenityVersion = '4.0.30'
    cucumberVersion = '7.14.0'
    junitVersion = '4.13.2'
    assertjVersion = '3.24.2'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    testImplementation "net.serenity-bdd:serenity-core:${serenityVersion}"
    testImplementation "net.serenity-bdd:serenity-screenplay:${serenityVersion}"
    testImplementation "net.serenity-bdd:serenity-screenplay-webdriver:${serenityVersion}"
    testImplementation "net.serenity-bdd:serenity-cucumber:${serenityVersion}"
    testImplementation "net.serenity-bdd:serenity-ensure:${serenityVersion}"
    testImplementation "io.cucumber:cucumber-java:${cucumberVersion}"
    testImplementation "junit:junit:${junitVersion}"
    testImplementation "org.assertj:assertj-core:${assertjVersion}"
    testImplementation "org.slf4j:slf4j-simple:2.0.9"
}

test {
    testLogging.showStandardStreams = true
    systemProperties System.getProperties()
}

gradle.startParameter.continueOnFailure = true

test.finalizedBy(aggregate)

sonarqube {
    properties {
        property "sonar.projectKey", "reto-tecnico-sqa-datepicker"
        property "sonar.projectName", "Reto Tecnico SQA - Datepicker HU-001"
        property "sonar.sources", "src/test/java"
        property "sonar.java.binaries", "build/classes"
        property "sonar.tests", "src/test/java"
        property "sonar.language", "java"
        property "sonar.sourceEncoding", "UTF-8"
    }
}
