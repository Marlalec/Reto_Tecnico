serenity {
  take.screenshots = FOR_EACH_ACTION
  report.show.step.details = true
  tag.failures = true
  linked.tags = "manual"
}

webdriver {
  driver = chrome
  autodownload = true
  capabilities {
    "goog:chromeOptions" {
      args = [
        "--start-maximized",
        "--disable-popup-blocking",
        "--disable-notifications",
        "--remote-allow-origins=*"
      ]
    }
  }
}
environments {
  default {
    webdriver.base.url = "https://jqueryui.com/datepicker/"
  }
  ci {
    webdriver {
      capabilities {
        "goog:chromeOptions" {
          args = ["--headless=new", "--no-sandbox", "--disable-dev-shm-usage", "--window-size=1920,1080"]
        }
      }
    }
  }
}

serenity.timeouts {
  implicit = 5000
  fluent.wait = 10000
}
